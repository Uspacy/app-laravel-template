name: Set up PHP and vendor
description: Sets up PHP and restores vendor/ cached by the install job.

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: "8.4"
        extensions: sqlite3
        coverage: none

    - uses: actions/cache/restore@v4
      with:
        path: vendor
        key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
        fail-on-cache-miss: true
