name: Code Style (Pint)

on:
  pull_request:
    branches: [main, stage]
    paths:
      - "**.php"
      - "pint.json"
      - ".github/workflows/pint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Laravel Pint (test mode)
        uses: aglipanci/laravel-pint-action@2.5
        with:
          testMode: true
          verboseMode: true
