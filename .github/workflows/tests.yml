name: Run tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3
          coverage: none

      - name: Set up project
        run: composer setup --no-interaction

      - name: Run tests
        run: php artisan test --env=testing
